version: "3.8"

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6381:6379"

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"